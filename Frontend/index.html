<!DOCTYPE html> 
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="pages/style/output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" type="image/png" href="https://plus.unsplash.com/premium_photo-1661882520489-a3e2029aca9f?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8ZG9ja2VyfGVufDB8fDB8fHww">
    <title>Projet Docker</title>   
</head>
<body class="" style="background-image: url('https://plus.unsplash.com/premium_photo-1661879970066-a8b18d89cb64?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NXx8ZG9ja2VyfGVufDB8fDB8fHww')
           ;">
    <div class="min-h-screen flex items-center justify-center">
  <div class="flex flex-col md:flex-row bg-white border border-gray-300 rounded-lg shadow-lg overflow-hidden w-full max-w-4xl">
    <form id="connexion" class="p-8 flex-1 space-y-4">
      <h2 class="text-2xl font-bold mb-4 text-center">Se connecter</h2>
      <div>
        <label for="email" class="block mb-1 font-medium">Email :</label>
        <input type="email" id="email" name="email" placeholder="Votre e-mail"
               class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" >
      </div>
      <div>
        <label for="nom" class="block mb-1 font-medium">Password :</label>
        <input type="password" id="mot_de_passe" name="motdepasse" placeholder="Votre mot de passe" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" >
      </div>   
      <button type="submit" class="w-full bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
        <i class="fa-solid fa-square-arrow-up-right"></i>
        Se connecter
      </button>
      <div id="message">
      </div>
    </form>
    <div class="hidden md:block md:w-1/2">
      <img src="https://media.istockphoto.com/id/1337837834/fr/photo/concept-de-s%C3%A9curit%C3%A9-internet-identifiant-dacc%C3%A8s-utilisateur-et-mot-de-passe-sur-ordinateur.jpg?b=1&s=612x612&w=0&k=20&c=zAccqnOy3j2o5fp-OdwKsW3hEqo8T_XozoUwOX95we4="
           alt="Image décorative" class="w-full h-full object-cover">
    </div> 
  </div>
</div>
<script src="pages/JS/login.js"></script>
</body>
</html>
