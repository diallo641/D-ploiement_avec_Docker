services:
  backend:
    image: backend:latest
    container_name: backend_app
    ports:
      - "5000:5000"
    env_file:
      - ./.env
    restart: unless-stopped

  frontend:
    image: frontend:latest
    container_name: frontend_app
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
